<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真あてクイズ</title>
<meta name="description" content="写真を見て答えを選ぶクイズ。題材は js/data.js が決める。">
<style>
/* ===== テーマ ===== */
:root {
  --bg:        #f4f2ee;
  --bg-raised: #ffffff;
  --bg-sunken: #e8e4dd;
  --ink:       #1c1b19;
  --ink-mute:  #6b6761;
  --line:      #d8d3ca;
  --accent:    #9a3b2a;
  --accent-ink:#ffffff;
  --ok:        #2f6b46;
  --ok-bg:     #e2efe7;
  --ng:        #a3342c;
  --ng-bg:     #f6e3e1;
  --shadow:    0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
  --radius:    10px;
}
:root[data-theme="dark"] {
  --bg:        #131313;
  --bg-raised: #1d1d1c;
  --bg-sunken: #0d0d0d;
  --ink:       #ece9e3;
  --ink-mute:  #9b968d;
  --line:      #333330;
  --accent:    #d0674f;
  --accent-ink:#1a1a19;
  --ok:        #7dc79b;
  --ok-bg:     #1c2f24;
  --ng:        #e0796d;
  --ng-bg:     #33201d;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
               "Yu Gothic Medium", "Yu Gothic", Meiryo, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* ===== ヘッダー / フッター ===== */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 20px 8px;
}
.site-title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .12em;
}
.icon-btn {
  border: 1px solid var(--line);
  background: var(--bg-raised);
  color: var(--ink-mute);
  border-radius: 999px;
  width: 34px; height: 34px;
  font-size: 15px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink-mute); }

.site-footer {
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 48px;
  color: var(--ink-mute);
  font-size: 12px;
  line-height: 1.6;
}
.site-footer p { margin: 0; }

/* ===== レイアウト ===== */
#app { max-width: 760px; margin: 0 auto; padding: 8px 20px 0; }
.screen { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== スタート画面 ===== */
.lead {
  font-size: 18px;
  line-height: 2;
  margin: 24px 0 32px;
}
.field { margin-bottom: 24px; }
.field-label {
  display: block;
  font-size: 12px;
  letter-spacing: .14em;
  color: var(--ink-mute);
  margin-bottom: 8px;
}
.field-note { font-size: 12px; color: var(--ink-mute); margin: 8px 0 0; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg-raised); }
.seg-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-mute);
  font: inherit;
  font-size: 14px;
  padding: 8px 20px;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn.is-active { background: var(--ink); color: var(--bg); }

.roster { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 20px; }
.roster-title { font-size: 12px; letter-spacing: .14em; color: var(--ink-mute); margin: 0 0 12px; }
.roster-list {
  list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 20px;
}
.roster-list li { font-size: 14px; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 5px 0; }
.roster-list span { color: var(--ink-mute); font-size: 12px; white-space: nowrap; }

/* ===== ボタン ===== */
.btn {
  appearance: none;
  font: inherit;
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform .08s, background .15s, border-color .15s, color .15s;
}
.btn:active { transform: translateY(1px); }
.btn-lg { padding: 14px 28px; font-size: 16px; font-weight: 700; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--ink-mute); border: 1px solid var(--line); padding: 14px 24px; font-size: 15px; }
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-mute); }

/* ===== 進捗 ===== */
.progress { margin: 16px 0 20px; }
.progress-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; letter-spacing: .1em; color: var(--ink-mute); margin-bottom: 8px;
}
.progress-bar { height: 3px; background: var(--bg-sunken); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* ===== 写真 ===== */
.photo { margin: 0 0 24px; }
.photo-frame {
  position: relative;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  aspect-ratio: 4 / 3;
  display: flex; align-items: center; justify-content: center;
}
@media (min-width: 640px) { .photo-frame { aspect-ratio: 16 / 10; } }
.photo-frame img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity .4s ease;
}
.photo-frame.is-ready img { opacity: 1; }
.photo-status {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  color: var(--ink-mute); font-size: 13px; line-height: 1.8;
}
.photo-frame.is-ready .photo-status { display: none; }
.spinner {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--ink-mute);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.photo-caption { font-size: 12px; color: var(--ink-mute); margin: 8px 2px 0; }
.photo-caption a { color: inherit; }

.prompt { font-size: 15px; color: var(--ink-mute); margin: 0 0 12px; letter-spacing: .04em; }

/* ===== 選択肢 ===== */
.choices {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.choice {
  appearance: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  line-height: 1.4;
  padding: 12px 14px;
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-raised);
  color: var(--ink);
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .08s, border-color .15s, background .15s;
}
.choice:hover:not(:disabled) { border-color: var(--ink-mute); transform: translateY(-1px); }
.choice:active:not(:disabled) { transform: none; }
.choice:disabled { cursor: default; box-shadow: none; }
.choice.is-dim { opacity: .38; }
.choice.is-correct {
  background: var(--ok-bg); border-color: var(--ok); color: var(--ok); opacity: 1;
}
.choice.is-wrong {
  background: var(--ng-bg); border-color: var(--ng); color: var(--ng); opacity: 1;
}
.choice .key {
  display: inline-block;
  min-width: 1.6em;
  margin-right: 6px;
  font-size: 11px;
  font-weight: 400;
  color: var(--ink-mute);
}

/* ===== 判定・解説 ===== */
.verdict { margin-top: 24px; }
.verdict-line { font-size: 20px; font-weight: 700; margin: 0 0 12px; }
.verdict-line.ok { color: var(--ok); }
.verdict-line.ng { color: var(--ng); }
.detail {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 20px;
}
.detail-title { font-size: 18px; margin: 0 0 4px; }
.detail-meta { font-size: 13px; color: var(--ink-mute); margin: 0 0 10px; }
.detail-note { font-size: 14px; margin: 0 0 12px; }
.detail-link { font-size: 13px; color: var(--accent); text-decoration: none; }
.detail-link:hover { text-decoration: underline; }

/* ===== 結果 ===== */
.result-head { text-align: center; padding: 32px 0 8px; }
.result-rank { font-size: 13px; letter-spacing: .2em; color: var(--ink-mute); margin: 0 0 4px; }
.result-score { margin: 0; font-size: 56px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.result-slash { color: var(--ink-mute); margin: 0 6px; font-weight: 400; }
#result-total { color: var(--ink-mute); font-size: 32px; }
.result-comment { margin: 12px 0 0; color: var(--ink-mute); font-size: 14px; }

.section-title { font-size: 12px; letter-spacing: .14em; color: var(--ink-mute); font-weight: 400; margin: 40px 0 12px; }
.review-list { list-style: none; margin: 0; padding: 0; }
.review-list li {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.mark { flex: none; width: 1.4em; font-weight: 700; }
.mark.ok { color: var(--ok); }
.mark.ng { color: var(--ng); }
.review-body { min-width: 0; }
.review-title { font-size: 15px; font-weight: 600; }
.review-sub { font-size: 13px; color: var(--ink-mute); }
.review-sub .picked { color: var(--ng); }

.result-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }

@media (max-width: 420px) {
  .choices { grid-template-columns: 1fr 1fr; }
  .choice { font-size: 13px; padding: 10px 10px; }
  .choice .key { display: none; }
}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏛</text></svg>">
</head>
<body>

<header class="site-header">
  <h1 id="site-title" class="site-title"></h1>
  <button id="theme-toggle" class="icon-btn" type="button" aria-label="配色を切り替える">◐</button>
</header>

<main id="app">

  <!-- ============ スタート画面 ============ -->
  <section id="screen-start" class="screen">
    <p id="lead" class="lead"></p>

    <div class="field" id="level-field" hidden>
      <span class="field-label">難易度</span>
      <div class="seg" id="level-seg" role="radiogroup" aria-label="難易度"></div>
    </div>

    <div class="field">
      <span class="field-label">出題数</span>
      <div class="seg" id="count-seg" role="radiogroup" aria-label="出題数">
        <button type="button" class="seg-btn is-active" data-count="10" role="radio" aria-checked="true">10問</button>
        <button type="button" class="seg-btn" data-count="20" role="radio" aria-checked="false">20問</button>
        <button type="button" class="seg-btn" data-count="40" role="radio" aria-checked="false">40問</button>
        <button type="button" class="seg-btn" data-count="80" role="radio" aria-checked="false">80問</button>
        <button type="button" class="seg-btn" data-count="0" role="radio" aria-checked="false">全問</button>
      </div>
      <p id="count-note" class="field-note"></p>
    </div>

    <button id="btn-start" class="btn btn-primary btn-lg" type="button">スタート</button>

    <div class="roster">
      <p id="roster-title" class="roster-title"></p>
      <ul id="roster-list" class="roster-list"></ul>
    </div>
  </section>

  <!-- ============ 出題画面 ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="progress">
      <div class="progress-meta">
        <span id="progress-text">1 / 10</span>
        <span id="score-text">正解 0</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <figure class="photo">
      <div id="photo-frame" class="photo-frame is-loading">
        <img id="photo-img" alt="">
        <div id="photo-status" class="photo-status"><span class="spinner"></span></div>
      </div>
      <figcaption id="photo-caption" class="photo-caption" hidden></figcaption>
    </figure>

    <p id="prompt" class="prompt"></p>

    <div id="choices" class="choices" role="group"></div>

    <div id="verdict" class="verdict" hidden>
      <p id="verdict-line" class="verdict-line"></p>
      <div class="detail">
        <h2 id="detail-title" class="detail-title"></h2>
        <p id="detail-meta" class="detail-meta"></p>
        <p id="detail-note" class="detail-note"></p>
        <a id="detail-link" class="detail-link" href="#" target="_blank" rel="noopener">Wikipediaで見る ↗</a>
      </div>
      <button id="btn-next" class="btn btn-primary btn-lg" type="button">次の問題へ</button>
    </div>
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="screen-result" class="screen" hidden>
    <div class="result-head">
      <p id="result-rank" class="result-rank"></p>
      <p class="result-score"><span id="result-correct">0</span><span class="result-slash">/</span><span id="result-total">0</span></p>
      <p id="result-comment" class="result-comment"></p>
    </div>

    <h2 class="section-title">解答一覧</h2>
    <ul id="review-list" class="review-list"></ul>

    <div class="result-actions">
      <button id="btn-retry" class="btn btn-primary btn-lg" type="button">もう一度</button>
      <button id="btn-home" class="btn btn-ghost" type="button">最初の画面へ</button>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p id="credit"></p>
</footer>

<script>
/**
 * 建築家あてクイズのデータ
 *
 * このファイルだけが題材を知っている。engine.js は QUIZ の形しか見ないので、
 * 別のクイズを作るときはこのファイルを差し替えればよい。
 *
 * QUIZ のフィールド
 *   id                 sessionStorage / localStorage のキーに使う識別子
 *   title / lead / prompt / rosterTitle / credit   画面に出す文言
 *   levels             難易度の選択。{ id, label, match(q) }
 *   choicesPerQuestion 1問あたりに並べる選択肢の数。0 なら常に全選択肢を並べる
 *   meta               解答後に出す1行（問題と正解の選択肢を受け取る関数）
 *   grades             [正答率の下限, 称号, ひとこと] を高い順に並べたもの
 *   choices            解答ボタン。{ id, name, sub }。並び順がそのままボタンの順になる
 *   questions          出題。{ id, answer, level, image, title, year, place, note, wiki }
 *
 * level は難易度。1 = 名前を知っていれば当たる代表作、2 = 建築を少し追っていれば
 * 分かるもの、3 = 作風を知らないと当てにくいもの。難易度の選択で絞り込む。
 * level 1 は「有名作品のみ」で出題されるので、16人それぞれに最低1問は置くこと。
 * level 2 は「すべて」でのみ出題される中間層。
 *
 * 写真について
 *   image を指定するとその URL / 相対パス（例: "images/yoyogi.jpg"）を最優先で使う。
 *   空のままなら wiki.ja → wiki.en の順に Wikipedia の REST API を叩き、
 *   記事の代表画像を取得して出題する。差し替えたい問題だけ image を書けばよい。
 *   記事が無い建築は写真を取得できないが、その問題は予備の問題と自動で
 *   差し替わるので、出題数は保たれる。
 */

const QUIZ = {
  id: 'architect',
  title: '建築家あてクイズ',
  lead: '建築の写真が表示されます。<br>設計した建築家を16人の中から選んでください。',
  prompt: 'この建築を設計したのは？',
  rosterTitle: '出題される建築家',
  credit: '写真は各建築のWikipedia記事の代表画像を実行時に読み込んでいます。著作権は各撮影者に帰属します。',

  choicesPerQuestion: 0,

  levels: [
    { id: 'all',    label: 'すべて',       match: () => true },
    { id: 'famous', label: '有名作品のみ', match: (q) => q.level === 1 },
    { id: 'deep',   label: 'マニア向け',   match: (q) => q.level === 3 },
  ],

  meta: (q, answer) => `${answer.name}／${q.year}／${q.place}`,

  grades: [
    [0.999, '巨匠',     '全問正解。もはや設計者本人では。'],
    [0.8,   '建築通',   'ディテールまでよく見えています。'],
    [0.6,   '愛好家',   '主要作はしっかり押さえています。'],
    [0.4,   '見習い',   '素材と輪郭に注目すると見分けやすくなります。'],
    [0,     '初学者',   'まずは代表作から。もう一周してみましょう。'],
  ],

  choices: [
    { id: 'kuma',      name: '隈研吾',                     sub: '1954–' },
    { id: 'ando',      name: '安藤忠雄',                   sub: '1941–' },
    { id: 'sanaa',     name: 'SANAA',                      sub: '1995–' },
    { id: 'ito',       name: '伊東豊雄',                   sub: '1941–' },
    { id: 'ban',       name: '坂茂',                       sub: '1957–' },
    { id: 'hara',      name: '原広司',                     sub: '1936–' },
    { id: 'naito',     name: '内藤廣',                     sub: '1950–' },
    { id: 'fujimoto',  name: '藤本壮介',                   sub: '1971–' },
    { id: 'maki',      name: '槇文彦',                     sub: '1928–2024' },
    { id: 'tange',     name: '丹下健三',                   sub: '1913–2005' },
    { id: 'kurokawa',  name: '黒川紀章',                   sub: '1934–2007' },
    { id: 'fujimori',  name: '藤森照信',                   sub: '1946–' },
    { id: 'wright',    name: 'フランク・ロイド・ライト',   sub: '1867–1959' },
    { id: 'corbu',     name: 'ル・コルビュジエ',           sub: '1887–1965' },
    { id: 'mies',      name: 'ミース・ファン・デル・ローエ', sub: '1886–1969' },
    { id: 'gaudi',     name: 'アントニ・ガウディ',         sub: '1852–1926' },
  ],

  questions: [
    // ── 隈研吾 ─────────────────────────────────────────
    { id:'kuma-kokuritsu', answer:'kuma', level:1, image:'', title:'国立競技場', year:'2019年', place:'東京都新宿区',
      wiki:{ja:'国立競技場', en:'Japan National Stadium'},
      note:'47都道府県の杉材で庇を編んだ「杜のスタジアム」。木と鉄骨のハイブリッド屋根。' },
    { id:'kuma-nezu', answer:'kuma', level:2, image:'', title:'根津美術館', year:'2009年', place:'東京都港区',
      wiki:{ja:'根津美術館', en:'Nezu Museum'},
      note:'深い大屋根と竹の並ぶアプローチ。表参道の喧噪から庭園へ人を導く。' },
    { id:'kuma-asakusa', answer:'kuma', level:2, image:'', title:'浅草文化観光センター', year:'2012年', place:'東京都台東区',
      wiki:{ja:'浅草文化観光センター', en:'Asakusa Culture Tourist Information Center'},
      note:'平屋の家を8層積み上げたような外観。斜めの屋根がそのまま各階の天井になる。' },
    { id:'kuma-kadokawa', answer:'kuma', level:2, image:'', title:'角川武蔵野ミュージアム', year:'2020年', place:'埼玉県所沢市',
      wiki:{ja:'角川武蔵野ミュージアム', en:'Kadokawa Culture Museum'},
      note:'約2万枚の花崗岩を貼った多面体の巨岩。木や格子を使わない異色作。' },
    { id:'kuma-vad', answer:'kuma', level:2, image:'', title:'V&Aダンディー', year:'2018年', place:'イギリス・ダンディー',
      wiki:{ja:'V&Aダンディー', en:'V&A Dundee'},
      note:'スコットランドの断崖から着想した、水面にせり出す反り返ったコンクリートの塊。' },
    { id:'kuma-takanawa', answer:'kuma', level:2, image:'', title:'高輪ゲートウェイ駅', year:'2020年', place:'東京都港区',
      wiki:{ja:'高輪ゲートウェイ駅', en:'Takanawa Gateway Station'},
      note:'折り紙のような白い膜屋根を、細い集成材の方杖が支える。' },
    { id:'kuma-hiroshige', answer:'kuma', level:3, image:'', title:'那珂川町馬頭広重美術館', year:'2000年', place:'栃木県那珂川町',

   先頭コメントを参照。このファイルは題材を知らないので、別の
   クイズを作るときは data.js だけ差し替えればよい。

   題材ごとに変えたくなるところは QUIZ の任意フックで差し替える。
   未指定なら既定の動きになる。
     keys        キーボードショートカットに使う文字の並び
     distractors (question, pool, n) => ダミーの選択肢。既定はプールからランダム
     detailSub   (q, answer) => 解説カードの2行目（学名など）
     reviewSub   (q, answer) => 結果一覧の副題。既定は正解の名前
     roster      () => スタート画面の一覧のHTML。既定は選択肢の平坦な一覧
     levels      [{ id, label, match(q) }] 難易度の選択。既定は出さない
   ========================================================= */

const $ = (id) => document.getElementById(id);
const byId = Object.fromEntries(QUIZ.choices.map((c) => [c.id, c]));
const KEYS = (QUIZ.keys || 'ASDFGHJKLZXCVBNM').split(''); // 選択肢に順に割り当てるショートカット

const state = {
  queue: [],       // { question, choices } の配列
  reserve: [],     // 画像が取れなかった問題と差し替えるための予備
  index: 0,
  level: null,     // 選択中の難易度（QUIZ.levels がある場合）
  answers: [],     // { question, picked, correct }
  answered: false,
  requestedCount: 10,
};

/* ---------- 画像の取得 ------------------------------------
   image が指定されていればそれを使う。無ければ Wikipedia の
   REST API から記事の代表画像を引く（ja → en の順）。
   結果は sessionStorage にキャッシュする。            */

const IMG_CACHE_KEY = `quiz.img.${QUIZ.id}.v1`;
const imgCache = loadCache();

function loadCache() {
  try { return JSON.parse(sessionStorage.getItem(IMG_CACHE_KEY)) || {}; }
  catch (_) { return {}; }
}
function saveCache() {
  try { sessionStorage.setItem(IMG_CACHE_KEY, JSON.stringify(imgCache)); }
  catch (_) { /* プライベートモード等では黙って諦める */ }
}

// サムネイルURLの幅指定（.../320px-Foo.jpg）を大きめに書き換える
function upscale(url) {
  return url.replace(/\/\d{2,4}px-/, '/1280px-');
}

async function fetchWikiImage(lang, title) {
  const endpoint = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
  const res = await fetch(endpoint, { headers: { Accept: 'application/json' } });
  if (!res.ok) return null;
  const data = await res.json();
  const src = (data.thumbnail && data.thumbnail.source) ||
              (data.originalimage && data.originalimage.source);
  if (!src) return null;
  return {
    url: upscale(src),
    page: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) ||
          `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`,
    label: lang === 'ja' ? 'Wikipedia（日本語）' : 'Wikipedia (English)',
  };
}

async function resolveImage(q) {
  if (q.image) return { url: q.image, page: null, label: null };
  if (imgCache[q.id]) return imgCache[q.id];

  const candidates = [['ja', q.wiki && q.wiki.ja], ['en', q.wiki && q.wiki.en]];
  for (const [lang, title] of candidates) {
    if (!title) continue;
    try {
      const found = await fetchWikiImage(lang, title);
      if (found) { imgCache[q.id] = found; saveCache(); return found; }
    } catch (_) { /* 次の候補へ */ }
  }
  return null;
}

// 次の問題の画像を先読みして待ち時間を減らす
function prefetch(entry) {
  if (!entry) return;
  resolveImage(entry.question).then((info) => {
    if (info) { const im = new Image(); im.src = info.url; }
  }).catch(() => {});
}

/* ---------- ユーティリティ ---------- */

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// その問題で並べる選択肢。choicesPerQuestion が選択肢総数より少なければ、
// 正解＋ダミーを抜き出す。0 や未指定なら常に全選択肢。
// ダミーの選び方は QUIZ.distractors(question, pool, n) で差し替えられる。
// 未指定ならプールからランダムに取る。
function choicesFor(q) {
  const n = QUIZ.choicesPerQuestion;
  if (!n || n >= QUIZ.choices.length) return QUIZ.choices;
  const pool = QUIZ.choices.filter((c) => c.id !== q.answer);
  const decoys = (QUIZ.distractors ? QUIZ.distractors(q, pool, n - 1) : shuffle(pool))
    .slice(0, n - 1);
  return shuffle([byId[q.answer], ...decoys]);
}

// 選択中の難易度に合う問題だけを返す
function pool() {
  const level = QUIZ.levels && QUIZ.levels.find((l) => l.id === state.level);
  return level ? QUIZ.questions.filter((q) => level.match(q)) : QUIZ.questions;
}

// できるだけ正解が偏らないように問題を並べる。
// 先頭 count 問を出題し、残りは画像が取れなかったときの差し替え用に取っておく。
function orderQuestions(source) {
  const byAnswer = new Map();
  for (const q of shuffle(source)) {
    if (!byAnswer.has(q.answer)) byAnswer.set(q.answer, []);
    byAnswer.get(q.answer).push(q);
  }
  const groups = shuffle([...byAnswer.values()]);
  const picked = [];
  for (let round = 0; picked.length < source.length; round++) {
    let added = false;
    for (const g of groups) {
      if (g[round]) { picked.push(g[round]); added = true; }
    }
    if (!added) break;
  }
  return picked;
}

function entryFor(question) {
  return { question, choices: choicesFor(question) };
}

function buildQueue(count) {
  const ordered = orderQuestions(pool());
  const total = count > 0 ? Math.min(count, ordered.length) : ordered.length;
  state.reserve = shuffle(ordered.slice(total)).map(entryFor);
  return shuffle(ordered.slice(0, total)).map(entryFor);
}

function showScreen(name) {
  for (const s of ['start', 'quiz', 'result']) {
    $(`screen-${s}`).hidden = (s !== name);
  }
  window.scrollTo(0, 0);
}

/* ---------- スタート画面 ---------- */

// 対応する要素が無い題材もあるので、見つからなければ黙って飛ばす
function fill(id, html) {
  const el = $(id);
  if (el && html != null) el.innerHTML = html;
}

function applyCopy() {
  document.title = QUIZ.title;
  fill('site-title', QUIZ.title);
  fill('lead', QUIZ.lead);
  fill('lead-sub', QUIZ.leadSub);
  fill('prompt', QUIZ.prompt);
  fill('roster-title', QUIZ.rosterTitle);
  fill('roster-count', QUIZ.rosterCount);
  fill('credit', QUIZ.credit);
  $('choices').setAttribute('aria-label', QUIZ.prompt);

  // 一覧の見せ方は QUIZ.roster() で差し替えられる（グループ分けしたい題材向け）
  $('roster-list').innerHTML = QUIZ.roster
    ? QUIZ.roster()
    : QUIZ.choices.map((c) => `<li>${c.name}<span>${c.sub || ''}</span></li>`).join('');

  buildLevels();
  syncCountOptions();
}

// QUIZ.levels があれば難易度の選択を出す
function buildLevels() {
  const field = $('level-field');
  if (!field || !QUIZ.levels) return;
  field.hidden = false;
  $('level-seg').innerHTML = QUIZ.levels
    .map((l, i) => `<button type="button" class="seg-btn${i ? '' : ' is-active'}" data-level="${l.id}"` +
                   ` role="radio" aria-checked="${!i}">${l.label}</button>`)
    .join('');
  state.level = QUIZ.levels[0].id;
  $('level-seg').querySelectorAll('.seg-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      $('level-seg').querySelectorAll('.seg-btn').forEach((b) => {
        b.classList.toggle('is-active', b === btn);
        b.setAttribute('aria-checked', String(b === btn));
      });
      state.level = btn.dataset.level;
      syncCountOptions();
    });
  });
}

// 出題数の選択肢は、選択中の難易度で解ける問題数に合わせて出し入れする
function syncCountOptions() {
  const available = pool().length;
  const buttons = [...$('count-seg').querySelectorAll('.seg-btn')];
  buttons.forEach((btn) => {
    const n = Number(btn.dataset.count);
    btn.hidden = n > 0 && n >= available;
  });
  fill('count-note', QUIZ.levels ? `この難易度の問題は${available}問あります` : null);
  const visible = buttons.filter((b) => !b.hidden);
  if (!visible.some((b) => b.classList.contains('is-active'))) selectCount(visible[0]);
}

function selectCount(btn) {
  $('count-seg').querySelectorAll('.seg-btn').forEach((b) => {
    b.classList.toggle('is-active', b === btn);
    b.setAttribute('aria-checked', String(b === btn));
  });
  state.requestedCount = Number(btn.dataset.count);
}

function initStart() {
  applyCopy();
  $('count-seg').querySelectorAll('.seg-btn').forEach((btn) => {
    btn.addEventListener('click', () => selectCount(btn));
  });
  $('btn-start').addEventListener('click', startQuiz);
}

/* ---------- 出題 ---------- */

function startQuiz() {
  state.queue = buildQueue(state.requestedCount);
  state.index = 0;
  state.answers = [];
  showScreen('quiz');
  renderQuestion();
}

function renderChoices(choices) {
  const box = $('choices');
  box.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice';
    btn.dataset.choice = c.id;
    btn.innerHTML = `<span class="key">${KEYS[i] || ''}</span>${c.name}`;
    btn.addEventListener('click', () => answer(c.id));
    box.appendChild(btn);
  });
}

async function renderQuestion() {
  const entry = state.queue[state.index];
  const q = entry.question;
  state.answered = false;

  $('progress-text').textContent = `${state.index + 1} / ${state.queue.length}`;
  $('score-text').textContent = `正解 ${state.answers.filter((a) => a.correct).length}`;
  $('progress-fill').style.width = `${(state.index / state.queue.length) * 100}%`;

  $('verdict').hidden = true;
  $('photo-caption').hidden = true;
  renderChoices(entry.choices);

  const frame = $('photo-frame');
  const img = $('photo-img');
  frame.classList.remove('is-ready');
  frame.classList.add('is-loading');
  img.removeAttribute('src');
  $('photo-status').innerHTML = '<span class="spinner"></span>';

  const token = q.id;                       // 読み込み中に次へ進んだ場合の取り違え防止
  const info = await resolveImage(q);
  if (state.queue[state.index].question.id !== token) return;

  if (!info) { swapOrFail('写真を読み込めませんでした。<br>オフラインの可能性があります。'); return; }

  img.onload = () => {
    if (state.queue[state.index].question.id !== token) return;
    frame.classList.remove('is-loading');
    frame.classList.add('is-ready');
  };
  img.onerror = () => {
    if (state.queue[state.index].question.id !== token) return;
    swapOrFail('写真を読み込めませんでした。');
  };
  img.src = info.url;
  q._source = info;

  prefetch(state.queue[state.index + 1]);
}

// 写真が取れない問題は、予備の問題と静かに差し替えて出題数を保つ。
// Wikipedia に記事が無い建築が混じっていても、遊ぶ側には見えない。
function swapOrFail(message) {
  if (state.reserve.length) {
    state.queue[state.index] = state.reserve.shift();
    renderQuestion();
    return;
  }
  $('photo-frame').classList.remove('is-ready');
  $('photo-status').innerHTML = message;
}

/* ---------- 解答 ---------- */

function answer(choiceId) {
  if (state.answered) return;
  state.answered = true;

  const q = state.queue[state.index].question;
  const correct = choiceId === q.answer;
  state.answers.push({ question: q, picked: choiceId, correct });

  document.querySelectorAll('.choice').forEach((btn) => {
    btn.disabled = true;
    const id = btn.dataset.choice;
    if (id === q.answer) btn.classList.add('is-correct');
    else if (id === choiceId) btn.classList.add('is-wrong');
    else btn.classList.add('is-dim');
  });

  const line = $('verdict-line');
  line.textContent = correct ? '正解' : `不正解 — 正解は ${byId[q.answer].name}`;
  line.className = `verdict-line ${correct ? 'ok' : 'ng'}`;

  $('detail-title').textContent = q.title;
  $('detail-meta').textContent = QUIZ.meta(q, byId[q.answer]);
  $('detail-note').textContent = q.note;

  const sub = $('detail-sub');
  if (sub) {
    const text = QUIZ.detailSub ? QUIZ.detailSub(q, byId[q.answer]) : '';
    sub.textContent = text || '';
    sub.hidden = !text;
  }

  const page = q._source && q._source.page;
  const link = $('detail-link');
  link.hidden = !page;
  if (page) link.href = page;

  // 出典表示は解答後に（記事名が答えのヒントになるため）
  if (page) {
    const cap = $('photo-caption');
    cap.innerHTML = `写真: <a href="${page}" target="_blank" rel="noopener">${q._source.label}</a> より`;
    cap.hidden = false;
  }

  $('score-text').textContent = `正解 ${state.answers.filter((a) => a.correct).length}`;
  $('progress-fill').style.width = `${((state.index + 1) / state.queue.length) * 100}%`;

  $('verdict').hidden = false;
  $('btn-next').textContent = state.index === state.queue.length - 1 ? '結果を見る' : '次の問題へ';
  $('btn-next').focus();
}

function next() {
  if (!state.answered) return;
  if (state.index === state.queue.length - 1) { showResult(); return; }
  state.index++;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 結果 ---------- */

function showResult() {
  const total = state.answers.length;
  const correct = state.answers.filter((a) => a.correct).length;
  const rate = correct / total;
  const [, rank, comment] = QUIZ.grades.find(([min]) => rate >= min);

  $('result-rank').textContent = rank;
  $('result-correct').textContent = correct;
  $('result-total').textContent = total;
  $('result-comment').textContent = comment;

  $('review-list').innerHTML = state.answers.map(({ question: q, picked, correct: ok }) => {
    const answer = byId[q.answer];
    const sub = QUIZ.reviewSub ? QUIZ.reviewSub(q, answer) : answer.name;
    return `
    <li>
      <span class="mark ${ok ? 'ok' : 'ng'}">${ok ? '○' : '×'}</span>
      <span class="review-body">
        <span class="review-title">${q.title}</span><br>
        <span class="review-sub">${sub}${
          ok ? '' : ` — 回答: <span class="picked">${byId[picked].name}</span>`
        }</span>
      </span>
    </li>`;
  }).join('');

  showScreen('result');
}

/* ---------- テーマ ---------- */

function initTheme() {
  const key = `quiz.theme.${QUIZ.id}`;
  const saved = (() => { try { return localStorage.getItem(key); } catch (_) { return null; } })();
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');

  $('theme-toggle').addEventListener('click', () => {
    const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nextTheme;
    try { localStorage.setItem(key, nextTheme); } catch (_) {}
  });
}

/* ---------- キーボード ---------- */

function initKeyboard() {
  document.addEventListener('keydown', (e) => {
    if ($('screen-quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.answered) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
      return;
    }
    const i = KEYS.indexOf(e.key.toUpperCase());
    const choices = state.queue[state.index].choices;
    if (i >= 0 && choices[i]) { e.preventDefault(); answer(choices[i].id); }
  });
}

/* ---------- 起動 ---------- */

initTheme();
initStart();
initKeyboard();
$('btn-next').addEventListener('click', next);
$('btn-retry').addEventListener('click', startQuiz);
$('btn-home').addEventListener('click', () => showScreen('start'));
</script>
</body>
</html>
