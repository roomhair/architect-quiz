name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/architect-quiz-site-ga69h0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1本に絞る。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 1ファイル版が最新のソースと一致しているか確認する
      - name: Check standalone build is up to date
        run: |
          node build-standalone.js
          git diff --exit-code -- dist/architect-quiz.html \
            || { echo '::error::dist/architect-quiz.html が古いです。node build-standalone.js を実行してコミットしてください。'; exit 1; }

      # リポジトリに Pages が未設定なら有効化を試みる
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
