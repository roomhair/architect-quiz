name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/architect-quiz-site-ga69h0
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # どのブランチでも走る検証。1ファイル版がソースと同期しているか確かめる。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check standalone build is up to date
        run: |
          node build-standalone.js
          git diff --exit-code -- dist/architect-quiz.html \
            || { echo '::error::dist/architect-quiz.html が古いです。node build-standalone.js を実行してコミットしてください。'; exit 1; }

      # ブラウザが古い css/js を掴んだままにならないよう、配信するHTMLの参照だけに
      # コミットSHAを付ける。リポジトリのファイルは相対パスのままなので、
      # ローカルで index.html を直接開く使い方は変わらない。
      - name: Add cache-busting query to assets
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ['GITHUB_SHA'][:8]
          s = open('index.html').read()
          s, n = re.subn(r'(href="css/style\.css|src="js/(?:data|engine)\.js)"', rf'\1?v={v}"', s)
          assert n == 3, f'参照の書き換えに失敗しました（置換 {n} 件、期待 3 件）'
          s = s.replace('<span id="build"></span>', f'<span id="build">build {v}</span>')
          open('index.html', 'w').write(s)
          PY
          grep -n 'style.css\|js/data.js\|js/engine.js\|id="build"' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Pages 環境は既定でデフォルトブランチからのデプロイしか許可しないため main 限定。
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
